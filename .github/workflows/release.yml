name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      LAZYKIMI_VERIFY_SUITE: all
      LAZYKIMI_VERIFY_TIMEOUT_SECONDS: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install pinned Python test runner
        run: python -m pip install pytest==8.4.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Install locked tooling dependencies
        working-directory: lazykimi-plugin/tooling
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Build the TypeScript CLI
        working-directory: lazykimi-plugin
        run: npm ci --ignore-scripts --no-audit --fund=false && npm run build

      - name: Validate release tag and package version
        run: |
          package_version="$(python3 -c 'import json; print(json.load(open("lazykimi-plugin/kimi.plugin.json"))["version"])')"
          test "$RELEASE_TAG" = "v$package_version"

      - name: Run package verification
        run: bash lazykimi-plugin/scripts/lazykimi-verify.sh

      - name: Run publication verification
        run: bash lazykimi-plugin/tests/publication-regression.sh

      - name: Build and exercise extracted release archive
        run: |
          release_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          bash scripts/build-release-archive.sh "$release_commit" "lazykimi-${RELEASE_TAG}.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-package-${{ env.RELEASE_TAG }}
          path: lazykimi-${{ env.RELEASE_TAG }}.tar.gz
          if-no-files-found: error

  verify-lifecycle:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      LAZYKIMI_VERIFY_SUITE: lifecycle
      LAZYKIMI_VERIFY_TIMEOUT_SECONDS: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install pinned Python test runner
        run: python -m pip install pytest==8.4.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install locked tooling dependencies
        working-directory: lazykimi-plugin/tooling
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Build the TypeScript CLI with locked dependencies
        working-directory: lazykimi-plugin
        run: npm ci --ignore-scripts --no-audit --fund=false && npm run build

      - name: Run timing-sensitive lifecycle regressions
        run: bash lazykimi-plugin/scripts/lazykimi-verify.sh

  publish:
    needs: [verify, verify-lifecycle]
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-package-${{ env.RELEASE_TAG }}

      - name: Publish release entry and missing asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_name="lazykimi-${RELEASE_TAG}.tar.gz"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$asset_name"; then
              echo "Release $RELEASE_TAG already contains $asset_name; leaving it unchanged."
            else
              gh release upload "$RELEASE_TAG" "$asset_name"
            fi
          else
            gh release create "$RELEASE_TAG" "$asset_name" \
              --verify-tag \
              --notes-file RELEASE_NOTES.md \
              --title "LazyKimi $RELEASE_TAG"
          fi
