name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supported-floor:
    name: Supported floor (Node 20)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20.0.0"
      - run: npm ci --prefix lazykimi-plugin/tooling --ignore-scripts --no-audit --no-fund
      - run: node --test lazykimi-plugin/tests/supported-floor.test.js
      - run: node lazykimi-plugin/scripts/verify-supported-floor.mjs --expected-runtime 20.0.0 --exercise package,install,onboarding
      - run: node lazykimi-plugin/scripts/verify-supported-floor.mjs --expected-runtime 20.0.0 --exercise lsp-provider --expect-unsupported

  lsp-supported-floor:
    name: Optional TypeScript LSP floor (Node 22.22.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.2"
      - run: node lazykimi-plugin/scripts/verify-supported-floor.mjs --expected-runtime 22.22.2 --exercise lsp-provider

  core:
    name: Core verification (Node ${{ matrix.node }})
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      LAZYKIMI_VERIFY_SUITE: all
      LAZYKIMI_VERIFY_TIMEOUT_SECONDS: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install pinned Python test runner
        run: python -m pip install pytest==8.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked tooling dependencies
        working-directory: lazykimi-plugin/tooling
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Build the TypeScript CLI
        working-directory: lazykimi-plugin
        run: npm ci --ignore-scripts --no-audit --fund=false && npm run build
      - name: Run package verification
        run: bash lazykimi-plugin/scripts/lazykimi-verify.sh
      - name: Run product-naming guard
        run: node scripts/check-product-naming.js
      - name: Run publication verification
        run: bash lazykimi-plugin/tests/publication-regression.sh

  validate:
    name: Deterministic validation
    if: ${{ always() }}
    needs: [supported-floor, lsp-supported-floor, core]
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Require all blocking jobs to succeed
        env:
          LSP_SUPPORTED_FLOOR_RESULT: ${{ needs.lsp-supported-floor.result }}
          SUPPORTED_FLOOR_RESULT: ${{ needs.supported-floor.result }}
          CORE_RESULT: ${{ needs.core.result }}
        run: |
          test "$SUPPORTED_FLOOR_RESULT" = success
          test "$LSP_SUPPORTED_FLOOR_RESULT" = success
          test "$CORE_RESULT" = success
